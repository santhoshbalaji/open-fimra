<div class="setup-page">
  <section class="setup-card bootstrap" aria-labelledby="bootstrap-heading">
    <h2 id="bootstrap-heading">Set up Open FIMRA</h2>
    <p>This installation has no workspace yet. The first person to finish this step becomes its administrator.
      The setup code is printed in the core API's log when it starts, or set by the system operator in
      <code>FIMRA_SETUP_CODE</code>.</p>
    <form #form novalidate (submit)="$event.preventDefault(); submit(form)">
      <fieldset [disabled]="busy()">
        <label>Setup code
          <input name="setupCode" required autocomplete="one-time-code" spellcheck="false" maxlength="64"
            aria-describedby="code-help">
          <small id="code-help">Four groups of letters and digits, such as ABCD-EFGH-JKMN-PQRS.</small>
        </label>
        <fieldset class="choice-group">
          <legend>Mode</legend>
          <label class="choice"><input type="radio" name="mode" value="state" checked> State
            <small>One state forest department on this installation.</small></label>
          <label class="choice"><input type="radio" name="mode" value="national" disabled aria-describedby="national-help"> National
            <small id="national-help">Not available yet. Phase 1 supports one state per installation.</small></label>
        </fieldset>
        <label>Workspace name
          <input #name name="workspaceName" required maxlength="120" (input)="nameChanged(name.value)"
            placeholder="Demo State">
        </label>
        <label>Workspace address
          <input name="workspaceSlug" required maxlength="40" pattern="[a-z0-9][a-z0-9\-]*" [value]="slug()"
            (input)="slugEdited.set(true); slug.set($any($event.target).value)" aria-describedby="slug-help">
          <small id="slug-help">Lowercase letters, numbers and hyphens. It appears in links and cannot be changed later.</small>
        </label>
        <label>State code
          <input name="stateCode" required maxlength="40" pattern="[A-Za-z0-9]([A-Za-z0-9_\-]*[A-Za-z0-9])?"
            aria-describedby="state-help" placeholder="DS">
          <small id="state-help">The code of the state in your boundary file, in its code column. The state boundary you
            upload later must use the same code.</small>
        </label>
        @if (error()) { <p class="setup-error" role="alert">{{ error() }}</p> }
        <button brnButton type="submit" class="setup-primary">Start setup</button>
      </fieldset>
    </form>
  </section>
</div>
