name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      - name: Run repository checks
        run: make check

  database:
    name: Database migrations and schema tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Start the development database
        run: make db-up
      - name: Apply, roll back and reapply migrations, then run the schema tests
        run: make db-test
      - name: Load the synthetic demo state and run the reference check
        run: make seed-test

  web:
    name: Web shell
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: make web-install web-lint web-test web-build PNPM=pnpm

  form-schema:
    name: Form format validators
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.6'
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Run both validators on the shared examples and type-check the TypeScript module
        run: make web-install form-schema-test PNPM=pnpm

  api:
    name: Core API lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: services/api/go.sum
      - run: make api-lint api-test

  api-integration:
    name: Core API integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: services/api/go.sum
      - run: make dev
      - run: make db-migrate
      - name: Test the core API, dashboard parity, notification replay and Mailpit delivery
        shell: bash
        run: |
          make api-test-integration | tee api-integration.log
          echo '### Dashboard timings on the demo data' >> "$GITHUB_STEP_SUMMARY"
          awk '/^=== RUN .*dashboard_SQL_parity\// {n=split($NF, parts, "/"); user=parts[n]}
               /summary, 20 signed requests/ {sub(/^.*summary, /, ""); print "- " user ": " $0}' api-integration.log >> "$GITHUB_STEP_SUMMARY"
      - name: Backfill the demo fixtures twice; the second run must fetch nothing
        run: |
          make backfill-demo
          make backfill-demo | tee backfill-repeat.log
          grep -q 'Ran 0 chunks (0 failed)' backfill-repeat.log
          grep -q 'inserted 0, duplicates 0' backfill-repeat.log
      - name: Check feed health once
        run: make feed-health

  layer-import:
    name: Layer import, publishing and replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: services/api/go.sum
      - run: make geo-test
      - run: make dev db-migrate geo-worker-up
      - name: Test draft review, publishing, grant confirmation and replay history
        run: make geo-test-integration
      - if: failure()
        run: docker compose -f deploy/compose/compose.dev.yml --profile geo logs geo-worker

  xlsform:
    name: XLSForm import and export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.6'
          cache: false
      - name: Export every example form and convert it with pyxform, the converter ODK uses
        run: make xlsform-odk-check
      - run: make db-up db-migrate
      - name: Run conversion jobs through the worker on the database
        run: make xlsform-test-integration

  exports:
    name: File exports
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: services/api/go.sum
      - name: Write and read back every format with OGR
        run: make geo-test
      - run: make dev db-migrate geo-worker-up
      - name: Export as each demo user, compare with the queue and tiles, and read every download back with OGR
        run: make export-test-integration
      - if: failure()
        run: docker compose -f deploy/compose/compose.dev.yml --profile geo logs geo-worker

  wizard:
    name: First-run wizard on an empty database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: services/api/go.sum
      - run: make dev
      - name: Claim a fresh install, upload layers, save a FIRMS key, invite officers and check their alerts
        run: make wizard-test-integration
      - if: failure()
        run: docker compose -f deploy/compose/compose.dev.yml --profile geo --profile mail logs

  mobile:
    name: Field app lint, tests and Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The Flutter image, the Android NDK and Gradle's files need about 17 GB.
      - name: Free disk space for the Android build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .mobile-cache/pub
          key: mobile-pub-${{ hashFiles('apps/mobile/pubspec.lock') }}
      - name: Check formatting, analysis and the generated theme
        run: make mobile-lint
      - name: Run the unit and widget tests
        run: make mobile-test
      - name: Build the Android test build
        run: make mobile-build
      # The cache action runs as the runner user, and the container wrote the cache as root.
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .mobile-cache apps/mobile

  mobile-integration:
    name: Field app sign-in and API client on the stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: services/api/go.sum
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .mobile-cache/pub
          key: mobile-pub-${{ hashFiles('apps/mobile/pubspec.lock') }}
      - run: make dev
      - name: Sign in with PKCE as each demo user and check alerts, steps and tiles
        run: make mobile-test-integration
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .mobile-cache apps/mobile
