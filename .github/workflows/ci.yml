name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      - name: Run repository checks
        run: make check

  database:
    name: Database migrations and schema tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Start the development database
        run: make db-up
      - name: Apply, roll back and reapply migrations, then run the schema tests
        run: make db-test
      - name: Load the synthetic demo state and run the reference check
        run: make seed-test

  web:
    name: Web shell
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: make web-install web-lint web-test web-build PNPM=pnpm

  api:
    name: Core API lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: services/api/go.sum
      - run: make api-lint api-test

  api-integration:
    name: Core API integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: services/api/go.sum
      - run: make dev
      - run: make db-migrate
      - name: Test sign-in, ingestion, alert workflow, queues, tiles, backfill and feed health
        run: make api-test-integration
      - name: Backfill the demo fixtures twice; the second run must fetch nothing
        run: |
          make backfill-demo
          make backfill-demo | tee backfill-repeat.log
          grep -q 'Ran 0 chunks (0 failed)' backfill-repeat.log
          grep -q 'inserted 0, duplicates 0' backfill-repeat.log
      - name: Check feed health once
        run: make feed-health

  layer-import:
    name: Layer import and draft review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: services/api/go.sum
      - run: make geo-test
      - run: make dev db-migrate geo-worker-up
      - run: make geo-test-integration
      - if: failure()
        run: docker compose -f deploy/compose/compose.dev.yml --profile geo logs geo-worker
