name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      - name: Run repository checks
        run: make check

  database:
    name: Database migrations and schema tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Start the development database
        run: make db-up
      - name: Apply, roll back and reapply migrations, then run the schema tests
        run: make db-test
      - name: Load the synthetic demo state and run the reference check
        run: make seed-test

  web:
    name: Web shell
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: make web-install web-lint web-test web-build PNPM=pnpm
