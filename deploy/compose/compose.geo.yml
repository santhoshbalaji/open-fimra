# Also extended by compose.dev.yml for the standalone development stack.
services:
  geo-worker:
    build:
      context: ../../services/geo-worker
      # The worker image builds the form validator from this folder.
      additional_contexts:
        form-schema: ../../packages/form-schema
        design-system: ../../docs/design-system
        report-locales: ../../apps/web/public/locales
    environment:
      PGHOST: db
      PGDATABASE: ${FIMRA_DB_NAME:-fimra}
      PGUSER: ${FIMRA_DB_USER:-fimra}
      PGPASSWORD: ${FIMRA_DB_PASSWORD:-fimra-dev}
    volumes:
      - type: bind
        source: ${FIMRA_UPLOAD_DIR:-../../.geo-uploads}
        target: /uploads
        read_only: true
      # Export files the worker writes and the API serves to their requester.
      - type: bind
        source: ${FIMRA_EXPORT_DIR:-../../.geo-exports}
        target: /exports
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp:size=64m
    restart: unless-stopped

networks:
  default:
    external: true
    name: open-fimra-shared_default
