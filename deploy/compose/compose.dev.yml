# Development stack for Open FIMRA. Not for production use.
#
# Start it with `make dev` from the repository root. Every port binds to
# 127.0.0.1 only. The passwords below are development defaults; override
# them in a .env file at the repository root (see .env.example).

name: open-fimra-dev

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${FIMRA_DB_NAME:-fimra}
      POSTGRES_USER: ${FIMRA_DB_USER:-fimra}
      POSTGRES_PASSWORD: ${FIMRA_DB_PASSWORD:-fimra-dev}
    ports:
      - "127.0.0.1:${FIMRA_DB_PORT:-15432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    # Imports the development realm (clients and demo users) on first start.
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${FIMRA_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${FIMRA_KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${FIMRA_KEYCLOAK_PORT:-18180}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The Keycloak image has no curl, so the check talks HTTP over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 1536m
    restart: unless-stopped

  mailpit:
    profiles: [mail]
    image: axllent/mailpit@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports:
      - "127.0.0.1:${FIMRA_MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${FIMRA_MAILPIT_HTTP_PORT:-18025}:8025"
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 128m

  # Self-hosted push server for field app notifications (UnifiedPush).
  # ntfy is open source under the Apache 2.0 and GPLv2 licences.
  ntfy:
    profiles: [push]
    image: binwiederhier/ntfy:v2.37.2@sha256:1875ddcf815c8a3c981d6d78c67a93452d0abba79b1ab9520b1f5f5238902bd7
    command: ["serve"]
    environment:
      NTFY_BASE_URL: http://127.0.0.1:${FIMRA_NTFY_PORT:-18110}
      NTFY_LISTEN_HTTP: ":8080"
      # Messages are kept in memory for a short time, which is enough for tests.
      NTFY_CACHE_DURATION: 1h
    ports:
      - "127.0.0.1:${FIMRA_NTFY_PORT:-18110}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://127.0.0.1:8080/v1/health | grep -q true"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    read_only: true

  geo-worker:
    profiles: [geo]
    extends:
      file: compose.geo.yml
      service: geo-worker
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  keycloak-data:
